# DebugMask — USB 偵錯防偵測模組設定
# 位置：/data/local/tmp/usbdebug_hider.conf（由 adb/root 寫入）
# 熱重載：hook 端每 2 秒檢查一次，改完不必重開機、不必重啟框架
# 注意：這只是「被注入的 App 之中，哪些要遮」；真正決定「哪些 App 會被注入」
#       的是 Vector/LSPosed 的 scope（見 deploy/usbdebug_hider_ctl.sh scope-all）

# 總開關
enabled=1

# 目標 App：
#   targets=*                     全部第三方 App（uid >= 10000；系統/root/shell 一律真值）
#   targets=com.a,com.b           只有這幾個（白名單）
#   targets=* !com.android.mtp    全部但排除特定包（! 開頭）
targets=*

# 三條遮蔽途徑
mask_settings=1         # Settings.Global/Secure/System（getInt/getString/... 與 cursor 直讀）
mask_query=1            # ContentResolver.query 讀 content://settings/*
mask_props=1            # 系統屬性（Java 層 android.os.SystemProperties）
mask_props_native=1     # 系統屬性（native 層 PLT/GOT：__system_property_get 等）

# 追加／覆寫要遮蔽的 key（可多行；值 = App 會讀到的假值）
# setting=adb_enabled=0
# prop=ro.boot.verifiedbootstate=green

# 移除預設遮蔽的 key
# del_prop=ro.build.tags
