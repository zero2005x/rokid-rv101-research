name: Build GhostLock APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK 27
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;27.0.12077973" 2>&1 || true
          # fallback: download standalone NDK if sdkmanager not available
          if [ ! -d "${ANDROID_SDK_ROOT}/ndk/27.0.12077973" ]; then
            NDK_URL="https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
            echo "Downloading NDK from ${NDK_URL}..."
            curl -fsSL -o /tmp/ndk.zip "$NDK_URL"
            unzip -qo /tmp/ndk.zip -d /tmp
            mv /tmp/android-ndk-r27 ${ANDROID_SDK_ROOT}/ndk/27.0.12077973
          fi
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass android -keypass android \
            -dname "CN=ghostlock-skeleton, OU=dev, O=oopnv70-lab, L=none, ST=none, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-apk
          path: app/build/outputs/apk/release/*.apk
