<?xml version="1.0" encoding="UTF-8"?>
<!-- Rokid Capture/Remote 品牌標誌
     概念：AR 眼鏡 × 相機光圈（左鏡片，青 #4FC3F7）× 隱私保護（右鏡片，琥珀斜線 #FFC24B）
     深色底：深藍 #0B1220；線條：近白 #E8EDF5 -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <rect width="108" height="108" rx="24" fill="#0B1220"/>

  <!-- 鏡腿 -->
  <path d="M22,48 Q20,44 26,39" fill="none" stroke="#E8EDF5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M86,48 Q88,44 82,39" fill="none" stroke="#E8EDF5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 鏡橋 -->
  <path d="M46,50 Q54,44 62,50" fill="none" stroke="#E8EDF5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 鏡片框 -->
  <path d="M28,46 H40 A6,6 0 0 1 46,52 V60 A6,6 0 0 1 40,66 H28 A6,6 0 0 1 22,60 V52 A6,6 0 0 1 28,46 Z"
        fill="none" stroke="#E8EDF5" stroke-width="2.5"/>
  <path d="M68,46 H80 A6,6 0 0 1 86,52 V60 A6,6 0 0 1 80,66 H68 A6,6 0 0 1 62,60 V52 A6,6 0 0 1 68,46 Z"
        fill="none" stroke="#E8EDF5" stroke-width="2.5"/>

  <!-- 左鏡片：相機光圈 -->
  <circle cx="34" cy="56" r="7.5" fill="none" stroke="#E8EDF5" stroke-width="2.5"/>
  <circle cx="34" cy="56" r="3.5" fill="#4FC3F7"/>

  <!-- 右鏡片：隱私指示 -->
  <circle cx="74" cy="56" r="2" fill="#E8EDF5"/>
  <path d="M66.5,49 L81.5,63" stroke="#FFC24B" stroke-width="3" stroke-linecap="round"/>
</svg>
